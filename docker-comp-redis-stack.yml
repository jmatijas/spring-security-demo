services:
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # Optional: A Web UI to see your Spring Sessions visually
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  postgres:
    image: 'postgres:18.3'
    container_name: postgres-dev
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

volumes:
  redis_data: